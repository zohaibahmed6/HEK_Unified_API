name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore HekCoreApi.sln

      - name: Build
        run: dotnet build HekCoreApi.sln --no-restore -c Release

      # LiveApi tests (Category=LiveIntegration) hit a real docker-compose stack on
      # http://localhost:8080 (see LiveApiFixture.cs) - there's no such stack in this runner,
      # so they must be excluded from the fast CI lane. Everything else runs in-process.
      - name: Test
        run: >
          dotnet test HekCoreApi.sln --no-build -c Release
          --filter "Category!=LiveIntegration"
          --logger trx
          --collect:"XPlat Code Coverage"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"
